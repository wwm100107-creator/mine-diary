<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Mine Diary — Nhật Ký & Chu Kỳ Pixel</title>
    <meta name="description" content="Nhật ký cá nhân và theo dõi chu kỳ dễ thương phong cách cute pixel" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFB7C5" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MineDiary" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Ponytail: Instant SW cleaner and chunk recovery (Preserving Firebase Push SW) -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              var scriptUrl = regs[i].active ? regs[i].active.scriptURL : '';
              if (!scriptUrl.includes('firebase-messaging-sw')) {
                regs[i].unregister();
              }
            }
          }).catch(function() {});
        }
        window.addEventListener('vite:preloadError', function() {
          window.location.reload();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF5F7;font-family:sans-serif;color:#FF8FAB;padding:20px;text-align:center;">
        <div style="font-size:40px;animation:bootBounce 0.8s infinite alternate ease-in-out;">🌸</div>
        <div style="font-size:14px;font-weight:bold;margin-top:12px;color:#FF5E7E;letter-spacing:0.02em;">Đang khởi động Mine Diary...</div>
        <div id="boot-actions" style="display:none;margin-top:16px;gap:8px;flex-direction:column;align-items:center;">
          <button onclick="window.location.reload()" style="background:#FF8FAB;color:#FFF;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:bold;box-shadow:0 2px 6px rgba(255,143,171,0.4);">🔄 Tải lại trang</button>
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.href=window.location.pathname+'?t='+Date.now();" style="background:#FFE4EC;color:#D81B60;border:1px solid #FF8FAB;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;margin-top:6px;">🧹 Xóa Cache & Tải Lại Ngay</button>
        </div>
        <script>
          setTimeout(function() {
            var el = document.getElementById('boot-actions');
            if (el) el.style.display = 'flex';
          }, 2000);
        </script>
        <style>
          @keyframes bootBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.1); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
