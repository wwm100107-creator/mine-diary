<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Primary Meta Tags -->
    <title>Mine Diary — Nhật Ký & Chu Kỳ Pixel</title>
    <meta name="description" content="Nhật ký cá nhân và theo dõi chu kỳ dễ thương phong cách cute pixel" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFB7C5" />

    <!-- Apple iOS Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MineDiary" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Anti-Blank Screen & Chunk Failure Auto-Recovery Script -->
    <script>
      (function() {
        // Auto-recover from Vite dynamic chunk 404s after new deployments
        window.addEventListener('vite:preloadError', function(event) {
          console.warn('[Vite Preload Error] Auto-recovering...');
          window.location.reload();
        });

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) || '';
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('Expected a JavaScript module') !== -1
          ) {
            console.warn('[Chunk Error] Recovering from script load failure...');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            window.location.reload();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF5F7;font-family:sans-serif;color:#FF8FAB;padding:20px;text-align:center;">
        <div style="font-size:40px;animation:bootBounce 0.8s infinite alternate ease-in-out;">🌸</div>
        <div style="font-size:14px;font-weight:bold;margin-top:12px;color:#FF5E7E;letter-spacing:0.02em;">Đang khởi động Mine Diary...</div>
        <style>
          @keyframes bootBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.1); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
