# Upstream definitions for Admin Portal & Backend
upstream admin_frontend_upstream {
    server admin-frontend:3001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream admin_backend_upstream {
    server admin-backend:4001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

# 2. Hardened Admin SSL Virtual Host
server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.3; # Enforce modern TLSv1.3 for Admin
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Hardened Security Headers for Admin Portal (Defense-in-Depth)
    add_header X-Frame-Options "DENY" always; # Completely disallow iframe embedding
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://admin.example.com;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Optional: IP Allowlist / VPN Lock (Uncomment to restrict to Corporate VPN/Static IP)
    # allow 14.161.0.0/16;
    # deny all;

    # Admin API Routes with aggressive rate limiting
    location /api/ {
        limit_req zone=admin_api_limit burst=10 nodelay;
        proxy_pass http://admin_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA Frontend
    location / {
        proxy_pass http://admin_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
