<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="splitBgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFB7C5" />
    </linearGradient>
    <linearGradient id="splitBgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F8FF" />
      <stop offset="100%" stop-color="#90CAF9" />
    </linearGradient>
    <linearGradient id="heartGradSplit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="256" height="512" />
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="256" y="0" width="256" height="512" />
    </clipPath>
  </defs>

  <!-- Left Half Base (Pink) -->
  <g clip-path="url(#leftHalf)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#splitBgLeft)" stroke="#FF8FAB" stroke-width="16" />
    <!-- Bunny Ear -->
    <rect x="160" y="96" width="48" height="112" rx="16" fill="#FFFFFF" stroke="#3D2B35" stroke-width="12" />
    <rect x="174" y="116" width="20" height="72" rx="8" fill="#FF8FAB" />
    <!-- Bunny Head Left -->
    <rect x="128" y="176" width="256" height="208" rx="64" fill="#FFFFFF" stroke="#3D2B35" stroke-width="14" />
    <!-- Bunny Eye -->
    <rect x="180" y="240" width="32" height="44" rx="10" fill="#3D2B35" />
    <rect x="186" y="244" width="12" height="14" rx="4" fill="#FFFFFF" />
    <rect x="144" y="280" width="36" height="20" rx="8" fill="#FF8FAB" opacity="0.85" />
  </g>

  <!-- Right Half Base (Blue Bear) -->
  <g clip-path="url(#rightHalf)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#splitBgRight)" stroke="#60A5FA" stroke-width="16" />
    <!-- Bear Round Ear -->
    <circle cx="362" cy="140" r="54" fill="#60A5FA" stroke="#1E3A8A" stroke-width="12" />
    <circle cx="362" cy="140" r="30" fill="#BFDBFE" />
    <!-- Bear Head Right -->
    <rect x="128" y="176" width="256" height="208" rx="64" fill="#93C5FD" stroke="#1E3A8A" stroke-width="14" />
    <!-- Bear Eye -->
    <rect x="300" y="240" width="32" height="44" rx="10" fill="#1E3A8A" />
    <rect x="306" y="244" width="12" height="14" rx="4" fill="#FFFFFF" />
    <rect x="332" y="280" width="36" height="20" rx="8" fill="#60A5FA" opacity="0.85" />
  </g>

  <!-- Center Dividing Seam Line -->
  <line x1="256" y1="24" x2="256" y2="488" stroke="#3D2B35" stroke-width="6" stroke-dasharray="12 8" />

  <!-- Center Pixel Nose -->
  <polygon points="256,274 246,262 266,262" fill="#FF5E7E" />

  <!-- Combined Pixel Heart in Center Bottom -->
  <g transform="translate(256, 384) scale(1.4)">
    <path d="M0,8 C-16,-12 -36,2 0,32 C36,2 16,-12 0,8 Z" fill="url(#heartGradSplit)" stroke="#3D2B35" stroke-width="6" stroke-linejoin="round" />
    <circle cx="-6" cy="6" r="3" fill="#FFF" opacity="0.8" />
  </g>
</svg>
