<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFD0E3" />
      <stop offset="100%" stop-color="#FFB7C5" />
    </linearGradient>
    
    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="100%" stop-color="#FF2A55" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle with Retro 3D Pixel Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#FF8FAB" stroke-width="16" />
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="#FFF" stroke-width="8" opacity="0.6" />

  <!-- ── Cute Pixel Bunny Art ── -->
  <!-- Left Ear -->
  <rect x="160" y="96" width="48" height="112" rx="16" fill="#FFFFFF" stroke="#3D2B35" stroke-width="12" />
  <rect x="174" y="116" width="20" height="72" rx="8" fill="#FF8FAB" />

  <!-- Right Ear -->
  <rect x="304" y="96" width="48" height="112" rx="16" fill="#FFFFFF" stroke="#3D2B35" stroke-width="12" />
  <rect x="318" y="116" width="20" height="72" rx="8" fill="#FF8FAB" />

  <!-- Bunny Head -->
  <rect x="128" y="176" width="256" height="208" rx="64" fill="#FFFFFF" stroke="#3D2B35" stroke-width="14" />

  <!-- Pixel Eyes (Big Cute Sparkle) -->
  <!-- Left Eye -->
  <rect x="180" y="240" width="32" height="44" rx="10" fill="#3D2B35" />
  <rect x="186" y="244" width="12" height="14" rx="4" fill="#FFFFFF" />
  <rect x="196" y="264" width="8" height="8" rx="2" fill="#FFFFFF" />

  <!-- Right Eye -->
  <rect x="300" y="240" width="32" height="44" rx="10" fill="#3D2B35" />
  <rect x="306" y="244" width="12" height="14" rx="4" fill="#FFFFFF" />
  <rect x="316" y="264" width="8" height="8" rx="2" fill="#FFFFFF" />

  <!-- Rosy Blush Cheeks -->
  <rect x="144" y="280" width="36" height="20" rx="8" fill="#FF8FAB" opacity="0.85" />
  <rect x="332" y="280" width="36" height="20" rx="8" fill="#FF8FAB" opacity="0.85" />

  <!-- Cute Pixel Nose & Mouth -->
  <polygon points="256,274 246,262 266,262" fill="#FF5E7E" />
  <path d="M242,284 Q256,296 256,286 Q256,296 270,284" fill="none" stroke="#3D2B35" stroke-width="8" stroke-linecap="round" />

  <!-- Mini Pixel Sparkle Stars -->
  <!-- Star Top-Left -->
  <path d="M96,128 L104,112 L112,128 L128,136 L112,144 L104,160 L96,144 L80,136 Z" fill="#FFD700" stroke="#FF9F43" stroke-width="4" />
  <!-- Star Top-Right -->
  <path d="M400,144 L408,132 L416,144 L428,150 L416,156 L408,168 L400,156 L388,150 Z" fill="#FFD700" stroke="#FF9F43" stroke-width="4" />

  <!-- ── Cute Pixel Heart Badge (Bottom Center) ── -->
  <g transform="translate(256, 384) scale(1.4)">
    <path d="M0,8 C-16,-12 -36,2 0,32 C36,2 16,-12 0,8 Z" fill="url(#heartGrad)" stroke="#3D2B35" stroke-width="6" stroke-linejoin="round" />
    <circle cx="-6" cy="6" r="3" fill="#FFF" opacity="0.8" />
  </g>
</svg>